name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install build tools
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Reorganize files into project structure
        run: |
          mkdir -p app/src/main/java/com/primoceara/deletebutton
          for f in MainActivity.java OverlayService.java DeleteAccessibilityService.java; do
            [ -f "$f" ] && mv "$f" app/src/main/java/com/primoceara/deletebutton/
          done

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeleteButton-apk
          path: app/build/outputs/apk/debug/app-debug.apk
