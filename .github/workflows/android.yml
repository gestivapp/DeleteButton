name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Reorganize files into project structure
        run: |
          mkdir -p app/src/main/java/com/primoceara/deletebutton
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          for f in MainActivity.java OverlayService.java DeleteAccessibilityService.java; do
            [ -f "$f" ] && mv "$f" app/src/main/java/com/primoceara/deletebutton/
          done

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeleteButton-apk
          path: app/build/outputs/apk/debug/app-debug.apk
