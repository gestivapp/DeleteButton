      - name: Build with Gradle
        run: |
          echo "=== settings.gradle ==="
          cat settings.gradle
          echo "=== app/build.gradle ==="
          cat app/build.gradle || echo "NAO ENCONTRADO"
          echo "=== Estrutura ==="
          find . -name "*.gradle" -o -name "*.java" -o -name "*.xml" | grep -v ".git" | sort
          gradle :app:assembleDebug
